name: Deploy to Cloudflare Pages

# One job, deliberately.
#
# This used to build in one job and deploy in another, shipping the site through
# actions/upload-pages-artifact. That was wrong: the artifact contains a
# top-level `build/` entry, so downloading it into `build/` produced
# `build/build/...`, and wrangler uploaded a single directory instead of the
# site. Every deploy reported success and published nothing usable.
#
# The CDN then served cached copies of the last good deployment, so every remote
# check returned `cf-cache-status: HIT` and reported a working site. Nothing
# surfaced until the cache aged out and the site began returning 404.
#
# A single job removes the round trip. `build/` is right there where it was
# produced, and the output-shape check below fails the run if the build did not
# produce a site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Verify the engine still compresses
        run: bun run test:engine

      # The comparator needs no browser and runs in about a second. It is the
      # guard on the visual regression suite's own logic: if the detector ever
      # stops detecting, the rendered-page suite below would go green while
      # proving nothing.
      - name: Verify the visual comparator and its negative controls
        run: bun run test:visual-comparator

      # The text-layer extractor and its negative controls. Same reasoning: a
      # detector that has stopped detecting would leave the suites below green
      # while proving nothing.
      - name: Verify the text-layer extractor and its negative controls
        run: bun run test:text-extract

      # Proves the fidelity suite's comparison can actually fail. The suite
      # gained a like-for-like comparison for downscaled images, and a check
      # that cannot fail is not a check.
      - name: Verify the fidelity comparison detects damage
        run: bun run test:fidelity-control

      # Catches text loss that passes every structural and visual check.
      - name: Verify text-layer preservation
        run: bun run test:text-integrity

      # Catches the class of defect that passes every structural check:
      # deduplication blanking a page while the file stays valid.
      - name: Verify structural and semantic preservation
        run: bun run test:integrity

      # The check that would have caught the broken deploy. A wrangler upload of
      # one file, or of a nested directory, still reports success - so assert on
      # the shape of what is about to be published, not on whether the upload
      # command exited zero.
      - name: Check the build output is a complete site
        run: |
          if [ ! -f build/index.html ]; then
            echo "::error::build/index.html is missing - this would deploy an empty site."
            echo "build/ contains:"
            find build -maxdepth 2 | head -20
            exit 1
          fi
          total=$(find build -type f | wc -l)
          assets=$(find build/_app -type f 2>/dev/null | wc -l)
          echo "build/ contains $total files, of which $assets under _app/"
          if [ "$total" -lt 10 ] || [ "$assets" -lt 5 ]; then
            echo "::error::build/ does not look like a complete site ($total files, $assets assets)."
            echo "Publishing this would replace the live site with something unusable."
            exit 1
          fi
          echo "Site looks complete."

      # Fail before wrangler is installed, not after. Without this the run
      # spends two minutes on green checks and then dies inside wrangler's
      # output, which reads like a deploy problem rather than a missing secret.
      - name: Check publish credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Nothing was published - repository secrets are not configured."
            echo ""
            echo "The build, the type check and every verification suite above DID run and pass."
            echo "The live site is unchanged. This is not a code failure."
            echo ""
            echo "To fix, add both under Settings > Secrets and variables > Actions:"
            echo "  CLOUDFLARE_API_TOKEN  - a token with 'Cloudflare Pages: Edit'"
            echo "  CLOUDFLARE_ACCOUNT_ID - shown in the Cloudflare dashboard sidebar"
            exit 1
          fi
          echo "Credentials present; publishing."

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # No --branch. This is a Direct Upload project with no production
          # branch configured, so omitting it targets production directly.
          command: pages deploy build --project-name=qcompress

      # A green deploy says the upload succeeded. It does not say the site is
      # reachable. This workflow was green repeatedly while publishing nothing
      # usable, so the production domain is fetched and must actually respond.
      - name: Verify the live site serves
        env:
          PAGE_URL: ${{ steps.deployment.outputs.deployment-url }}
          ENVIRONMENT: ${{ steps.deployment.outputs.pages-environment }}
          LIVE: https://${{ vars.PAGES_HOST || 'qcompress.pages.dev' }}
        run: |
          echo "environment: $ENVIRONMENT"
          echo "live host  : $LIVE"
          echo ""
          for url in "$LIVE" "$PAGE_URL"; do
            [ -z "$url" ] && continue
            status=$(curl -s -o /dev/null -w '%{http_code}' "$url/")
            echo "GET $url/  ->  $status"
            if [ "$status" = "200" ]; then
              echo "  headers:"
              curl -sSI "$url/" | grep -Ei 'cache-control|x-frame-options|referrer-policy|x-robots-tag' | sed 's/^/    /' || true
            fi
            echo ""
          done
          live_status=$(curl -s -o /dev/null -w '%{http_code}' "$LIVE/")
          if [ "$live_status" != "200" ]; then
            echo "::error::The live site is not serving (HTTP $live_status). The previous good deployment may have been replaced by an empty one."
            exit 1
          fi
          echo "Live site responds."