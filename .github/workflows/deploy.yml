name: Deploy to Cloudflare Pages

# Requires two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  - token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID - from the Cloudflare dashboard sidebar
#
# Without those secrets this workflow fails at the deploy step; the build and
# checks still run, so it doubles as CI.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Verify the engine still compresses
        run: bun run test:engine

      # The comparator needs no browser and runs in about a second. It is the
      # guard on the visual regression suite's own logic: if the detector ever
      # stops detecting, the rendered-page suite below would go green while
      # proving nothing.
      - name: Verify the visual comparator and its negative controls
        run: bun run test:visual-comparator

      # The text-layer extractor and its negative controls. Same reasoning: a
      # detector that has stopped detecting would leave the suites below green
      # while proving nothing.
      - name: Verify the text-layer extractor and its negative controls
        run: bun run test:text-extract

      # Proves the fidelity suite's comparison can actually fail. The suite
      # gained a like-for-like comparison for downscaled images, and a check
      # that cannot fail is not a check.
      - name: Verify the fidelity comparison detects damage
        run: bun run test:fidelity-control

      # Catches text loss that passes every structural and visual check.
      - name: Verify text-layer preservation
        run: bun run test:text-integrity

      # Catches the class of defect that passes every structural check:
      # deduplication blanking a page while the file stays valid.
      - name: Verify structural and semantic preservation
        run: bun run test:integrity

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      # `deployment-url` is the output wrangler-action actually exposes.
      url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      # Fail before wrangler is installed, not after. Without this the run
      # spends two minutes on green checks and then dies inside wrangler's
      # output, which reads like a deploy problem rather than a missing secret
      # - and a red build step is easy to mistake for a broken release.
      - name: Check publish credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Nothing was published - repository secrets are not configured."
            echo ""
            echo "The build, the type check and every verification suite above DID run and pass."
            echo "The live site is unchanged. This is not a code failure."
            echo ""
            echo "To fix, add both under Settings > Secrets and variables > Actions:"
            echo "  CLOUDFLARE_API_TOKEN  - a token with 'Cloudflare Pages: Edit'"
            echo "  CLOUDFLARE_ACCOUNT_ID - shown in the Cloudflare dashboard sidebar"
            echo ""
            echo "Then re-run this workflow. Until then, deploy from a terminal:"
            echo "  bun run build && bunx wrangler pages deploy build --project-name=qcompress"
            exit 1
          fi
          echo "Credentials present; publishing."

      # Required. Each job gets a fresh runner, and `upload-pages-artifact`
      # packages the site rather than leaving a `build/` directory on disk, so
      # the deploy job starts with no `build/` at all. Without this, wrangler
      # fails with ENOENT on `scandir .../build` - which was masked for two
      # releases by the credential error firing first.
      - name: Fetch the built site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: build

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # No --branch. This is a Direct Upload project with no production
          # branch configured, so omitting it targets production directly.
          #
          # This WAS added because the site appeared to be serving a preview:
          # x-robots-tag: noindex was present and the _headers rules seemed to
          # be ignored. Removing --branch did NOT change either. The real cause
          # is still unestablished - see the verification step below, which now
          # measures the deployed response instead of inferring it. Do not trust
          # the earlier reasoning recorded in the roadmap about this.
          command: pages deploy build --project-name=qcompress

      # A green deploy says the upload succeeded. It does not say the deployment
      # behaves correctly - this workflow was green for a full run while the
      # site returned headers nobody had looked at.
      #
      # Checked against the freshly created deployment, before any CDN has
      # cached it. That vantage point matters: the production domain can only be
      # read as `cf-cache-status: HIT`, which reports the cached response rather
      # than what the deployment actually returns.
      - name: Verify the deployment responds
        env:
          # wrangler-action has no `pages-url`. Its actual outputs, printed by
          # the guard below when this was wrong:
          #   deployment-url, pages-deployment-id, pages-environment,
          #   command-output, command-stderr
          PAGE_URL: ${{ steps.deployment.outputs.deployment-url }}
          ENVIRONMENT: ${{ steps.deployment.outputs.pages-environment }}
        run: |
          if [ -z "$PAGE_URL" ]; then
            echo "::error::wrangler-action reported no deployment-url."
            echo "Available outputs: ${{ toJSON(steps.deployment.outputs) }}"
            exit 1
          fi
          echo "deployment : $PAGE_URL"
          echo "environment: $ENVIRONMENT"
          status=$(curl -s -o /dev/null -w '%{http_code}' "$PAGE_URL/")
          echo "GET / -> $status"
          if [ "$status" != "200" ]; then
            echo "::error::The deployment URL does not serve the site (HTTP $status)."
            echo "The upload succeeded but the site is not reachable at its own deployment URL."
            exit 1
          fi
          echo ""
          echo "response headers:"
          curl -sSI "$PAGE_URL/" | grep -Ei 'cache-control|x-frame-options|referrer-policy|x-robots-tag' || true
          echo ""
          # static/_headers sets immutable caching for hashed assets and adds two
          # security headers. If it is not applied the site still works; assets
          # are simply re-fetched far more often than intended.
          missing=""
          curl -sSI "$PAGE_URL/" | grep -qi 'x-frame-options' || missing="$missing x-frame-options"
          curl -sSI "$PAGE_URL/" | grep -qi 'immutable'        || missing="$missing immutable-caching"
          if [ -n "$missing" ]; then
            echo "::warning::_headers is not being applied. Missing:$missing"
            echo "The site still works. This is a caching and security-posture gap, not a break."
          else
            echo "_headers is being applied."
          fi